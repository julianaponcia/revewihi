<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LiBROry — Review a Book</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="toast-box"></div>
    <div class="app-window">
        <aside class="outer-sidebar">
            <div class="orange-capsule">
                <div>
                    <div class="brand-header"><span>📚</span><span>LiBROry</span></div>
                    <nav class="nav-menu">
                        <a href="index.html" class="nav-item"><i class="fa-solid fa-store"></i>Home</a>
                        <a href="return.html" class="nav-item"><i class="fa-solid fa-book"></i>Return a book</a>
                        <a href="process.html" class="nav-item"><i class="fa-solid fa-exchange-alt"></i>Process returns</a>
                        <a href="returned.html" class="nav-item"><i class="fa-solid fa-file-import"></i>Returned books</a>
                        <a href="review.html" class="nav-item active"><i class="fa-solid fa-face-grin-stars"></i>Review a book</a>
                        <a href="borrow.html" class="nav-item"><i class="fa-solid fa-book-tanakh"></i>Borrow a book</a>
                        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-simple"></i>Dashboard</a>
                    </nav>
                </div>
                <button class="logout-btn" onclick="logoutSystem()"><i class="fa-solid fa-door-open"></i>Log out</button>
            </div>
        </aside>
        <main class="main-viewport">
            <div class="top-bar"><h1>Review a Book & Real-Time Feedback</h1></div>
            <p class="tagline-text">Submit your feedback. Rating 4 or 5 stars automatically updates your personal genre recommendations.</p>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                <div class="form-box">
                    <form onsubmit="handleReviewSubmit(event)">
                        <div class="form-group">
                            <label>Select Book:</label>
                            <select id="review-book-select" class="form-input" onchange="displayReviews()" required></select>
                        </div>
                        <div class="form-group">
                            <label>Rating (1 to 5 Stars):</label>
                            <select id="review-rating" class="form-input">
                                <option value="5">★★★★★ (5 Stars)</option>
                                <option value="4">★★★★☆ (4 Stars)</option>
                                <option value="3">★★★☆☆ (3 Stars)</option>
                                <option value="2">★★☆☆☆ (2 Stars)</option>
                                <option value="1">★☆☆☆☆ (1 Star)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Review Comment:</label>
                            <textarea id="review-comment" class="form-input" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="action-btn">Post Review</button>
                    </form>
                </div>

                <div>
                    <h2 style="font-size:18px; margin-bottom: 12px;">Live Real-Time Reviews</h2>
                    <div id="live-reviews-container" style="background:var(--card-gray); padding:20px; border-radius:16px; min-height:250px;"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="javascript.js"></script>
    <script>
        const select = document.getElementById('review-book-select');
        books.forEach(b => {
            select.innerHTML += `<option value="${b.id}">[Code: ${b.code}] ${b.title}</option>`;
        });

        function displayReviews() {
            const bookId = select.value;
            const container = document.getElementById('live-reviews-container');
            const bookReviews = reviews[bookId] || [];

            if (bookReviews.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); font-style:italic;">There are no current reviews for this book.</p>`;
                return;
            }

            container.innerHTML = '';
            bookReviews.forEach(r => {
                container.innerHTML += `<div style="border-bottom:1px solid #cbd5e1; padding:8px 0;"><strong>${r.user}</strong> — <span style="color:#f59e0b;">${'★'.repeat(r.rating)}</span><p style="font-size:13px; margin-top:4px;">${r.comment}</p></div>`;
            });
        }

        function handleReviewSubmit(e) {
            e.preventDefault();
            const bookId = select.value;
            const rating = parseInt(document.getElementById('review-rating').value);
            const comment = document.getElementById('review-comment').value.trim();

            if (!reviews[bookId]) reviews[bookId] = [];
            reviews[bookId].push({ user: currentUser || 'Anonymous', rating, comment });

            // Recommendation algorithm check
            const targetBook = books.find(b => b.id == bookId);
            if (rating >= 4 && targetBook && !likedGenres.includes(targetBook.category)) {
                likedGenres.push(targetBook.category);
            }

            saveData();
            toast('Review posted successfully!');
            document.getElementById('review-comment').value = '';
            displayReviews();
        }

        displayReviews();
    </script>
</body>
</html>
